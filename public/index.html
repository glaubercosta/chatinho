<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatinho - n8n Webhook Chat</title>
    <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>Chatinho</h1>
            <p>Chat with n8n webhook integration</p>
        </div>
        
        <div class="chat-messages" id="messages">
            <!-- Messages will be displayed here -->
        </div>
        
        <div class="chat-input">
            <div class="input-group">
                <input type="text" id="senderName" placeholder="Your name" value="Anonymous">
                <input type="text" id="messageInput" placeholder="Type your message..." autocomplete="off">
                <label class="checkbox-container">
                    <input type="checkbox" id="sendToN8n" checked>
                    <span class="checkmark"></span>
                    Send to n8n
                </label>
                <button id="sendButton">Send</button>
            </div>
        </div>
    </div>
    
    <div class="webhook-info">
        <h3>n8n Webhook Integration</h3>
        <p><strong>Incoming webhook endpoint:</strong> <code>POST /webhook/n8n</code></p>
        <p><strong>Expected payload:</strong> <code>{"message": "Hello from n8n", "sender": "n8n"}</code></p>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="assets/js/chat.js"></script>
</body>
</html>
