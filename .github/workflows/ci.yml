name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, 'maint/*', 'release/*' ]
  pull_request:
    branches: [ main, develop ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint || echo "No lint script defined"

      - name: Run tests
        run: npm test

      - name: Run coverage
        run: npm run test:coverage || npm test

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        if: github.event_name == 'push'
        with:
          file: ./coverage/lcov.info
          fail_ci_if_error: false

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: chatinho:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker image
        run: |
          docker run --rm -d --name chatinho-test -p 3000:3000 chatinho:test
          sleep 10
          curl -f http://localhost:3000/health || exit 1
          docker stop chatinho-test

  security-check:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        run: npm audit --audit-level high

      - name: Run CodeQL Analysis
        uses: github/codeql-action/analyze@v2
        with:
          languages: javascript

  auto-merge:
    name: Auto-merge dependabot PRs
    runs-on: ubuntu-latest
    needs: [test, docker-build, security-check]
    if: github.actor == 'dependabot[bot]' && github.event_name == 'pull_request'
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Enable auto-merge for Dependabot PRs
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify-status:
    name: Notify Build Status
    runs-on: ubuntu-latest
    needs: [test, docker-build, security-check]
    if: always() && github.ref == 'refs/heads/main'

    steps:
      - name: Notify success
        if: needs.test.result == 'success' && needs.docker-build.result == 'success' && needs.security-check.result == 'success'
        run: |
          echo "✅ All checks passed on main branch"
          # Add your notification logic here

      - name: Notify failure
        if: needs.test.result == 'failure' || needs.docker-build.result == 'failure' || needs.security-check.result == 'failure'
        run: |
          echo "❌ Build failed on main branch"
          # Add your failure notification logic here