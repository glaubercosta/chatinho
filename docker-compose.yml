version: '3.8'

services:
  # Serviço principal do Chatinho
  chatinho:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: chatinho:latest
    container_name: chatinho-app
    restart: unless-stopped
    ports:
      - "${PORT:-3002}:3002"
    environment:
      - NODE_ENV=production
      - PORT=3002
      - N8N_WEBHOOK_URL=${N8N_WEBHOOK_URL}
      - ADMIN_KEY=${ADMIN_KEY}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      - MESSAGE_RETENTION_HOURS=${MESSAGE_RETENTION_HOURS:-24}
      - MAX_MESSAGE_LENGTH=${MAX_MESSAGE_LENGTH:-1000}
    volumes:
      - ./logs:/app/logs:rw
      # Opcional: mount de configurações
      - ./.env:/app/.env:ro
    networks:
      - chatinho-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  # Serviço para desenvolvimento (opcional)
  chatinho-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev  # Criaremos este arquivo também
      target: development
    image: chatinho:dev
    container_name: chatinho-dev
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=development
      - PORT=3002
      - N8N_WEBHOOK_URL=${N8N_WEBHOOK_URL}
    volumes:
      - .:/app:rw
      - /app/node_modules
      - ./logs:/app/logs:rw
    networks:
      - chatinho-network
    profiles:
      - dev
    command: npm run dev

  # Nginx como proxy reverso (opcional para produção)
  nginx:
    image: nginx:alpine
    container_name: chatinho-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx:rw
    depends_on:
      - chatinho
    networks:
      - chatinho-network
    profiles:
      - production
      - nginx

networks:
  chatinho-network:
    driver: bridge
    name: chatinho-network

volumes:
  chatinho_logs:
    driver: local