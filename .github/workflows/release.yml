name: Release Pipeline

on:
  push:
    tags:
      - 'v*'              # Production releases (v1.0.0, v2.1.3)
      - 'v*-rc.*'         # Release candidates (v2.0.0-rc.1)
      - 'v*-beta.*'       # Beta releases (v2.0.0-beta.1)

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_production: ${{ steps.version.outputs.is_production }}
      is_rc: ${{ steps.version.outputs.is_rc }}
      is_beta: ${{ steps.version.outputs.is_beta }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint || echo "No lint script defined"

      - name: Run tests
        run: npm test

      - name: Parse version info
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          
          if [[ $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_production=true" >> $GITHUB_OUTPUT
            echo "is_rc=false" >> $GITHUB_OUTPUT
            echo "is_beta=false" >> $GITHUB_OUTPUT
            echo "environment=production" >> $GITHUB_OUTPUT
          elif [[ $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]; then
            echo "is_production=false" >> $GITHUB_OUTPUT
            echo "is_rc=true" >> $GITHUB_OUTPUT
            echo "is_beta=false" >> $GITHUB_OUTPUT
            echo "environment=staging" >> $GITHUB_OUTPUT
          elif [[ $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
            echo "is_production=false" >> $GITHUB_OUTPUT
            echo "is_rc=false" >> $GITHUB_OUTPUT
            echo "is_beta=true" >> $GITHUB_OUTPUT
            echo "environment=testing" >> $GITHUB_OUTPUT
          else
            echo "Invalid version format: $VERSION"
            exit 1
          fi

  build-and-publish:
    name: Build and Publish Docker Image
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build-and-publish
    if: needs.validate.outputs.is_production == 'true'

    steps:
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v${{ needs.validate.outputs.version }}'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [validate, build-and-publish, security-scan]
    if: needs.validate.outputs.is_production == 'true'
    environment: production

    steps:
      - name: Deploy to production
        run: |
          echo "🚀 Deploying v${{ needs.validate.outputs.version }} to production"
          echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v${{ needs.validate.outputs.version }}"
          # Add your deployment commands here

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [validate, build-and-publish]
    if: needs.validate.outputs.is_rc == 'true'
    environment: staging

    steps:
      - name: Deploy to staging
        run: |
          echo "🧪 Deploying v${{ needs.validate.outputs.version }} to staging"
          echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v${{ needs.validate.outputs.version }}"
          # Add your staging deployment commands here

  deploy-testing:
    name: Deploy to Testing
    runs-on: ubuntu-latest
    needs: [validate, build-and-publish]
    if: needs.validate.outputs.is_beta == 'true'
    environment: testing

    steps:
      - name: Deploy to testing
        run: |
          echo "🔬 Deploying v${{ needs.validate.outputs.version }} to testing"
          echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v${{ needs.validate.outputs.version }}"
          # Add your testing deployment commands here

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [validate, build-and-publish]
    if: needs.validate.outputs.is_production == 'true'
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          # Get previous tag
          PREVIOUS_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed -n '2p')
          if [ -z "$PREVIOUS_TAG" ]; then
            PREVIOUS_TAG=$(git rev-list --max-parents=0 HEAD)
          fi
          
          # Generate changelog
          echo "## 🚀 What's New in v${{ needs.validate.outputs.version }}" > changelog.md
          echo "" >> changelog.md
          
          # Get commits since last tag
          git log ${PREVIOUS_TAG}..HEAD --oneline --grep="feat:" --grep="fix:" --grep="BREAKING CHANGE:" --pretty=format:"- %s" >> changelog.md
          
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          cat changelog.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ needs.validate.outputs.version }}
          release_name: Release v${{ needs.validate.outputs.version }}
          body: ${{ steps.changelog.outputs.changelog }}
          draft: false
          prerelease: false

  notify:
    name: Notify Deployment
    runs-on: ubuntu-latest
    needs: [validate, deploy-production, deploy-staging, deploy-testing]
    if: always()

    steps:
      - name: Notify success
        if: needs.deploy-production.result == 'success' || needs.deploy-staging.result == 'success' || needs.deploy-testing.result == 'success'
        run: |
          echo "✅ Deployment successful for v${{ needs.validate.outputs.version }}"
          # Add notification logic (Slack, Discord, etc.)

      - name: Notify failure
        if: failure()
        run: |
          echo "❌ Deployment failed for v${{ needs.validate.outputs.version }}"
          # Add failure notification logic